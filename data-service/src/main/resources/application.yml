server:
  port: 8081

spring:
  application:
    name: data-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/genai_data_pipeline?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: 0
      timeout: 3s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

genai:
  pipeline:
    clean:
      max-retry-times: 3
      processing-timeout: 10m
    python-worker:
      base-url: ${GENAI_PYTHON_WORKER_BASE_URL:http://localhost:8000}
      connect-timeout-millis: 2000
      read-timeout-millis: 5000

resilience4j:
  circuitbreaker:
    instances:
      python-clean-worker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      python-clean-worker:
        timeout-duration: 6s

mybatis-plus:
  # autoResultMap is enabled on each @TableName annotation in the entity classes.
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
